name: Release Package

on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege: publishing authenticates to NuGet with its own key, so the GitHub token needs
# nothing beyond reading this repository.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # global-json-file, not dotnet-version: the repository pins an SDK feature band, and 8.0.1xx and
      # 8.0.4xx ship different analyzer versions. Letting CI resolve 8.0.x independently is how a build
      # passes on a developer machine and fails here on a rule neither of them chose.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore OnCourse.ABConnect.sln

      - name: Build
        run: dotnet build OnCourse.ABConnect.sln -c Release --no-restore -warnaserror

      # The Live trait needs devel partner credentials, which CI does not have.
      - name: Test
        run: dotnet test OnCourse.ABConnect.sln -c Release --no-build --filter "Category!=Live"

      # Gate G-7. The README is the package README, so a sample that does not compile must not ship.
      - name: Check README samples compile
        run: dotnet run --project tools/ReadmeFenceCheck/ReadmeFenceCheck.csproj -c Release -- README.md

      # The version is the release tag with any leading "v" removed. NuGet rejects "v3.0.0" as a
      # version string outright, so passing the raw ref name fails the pack for every tag written in
      # the conventional "v"-prefixed form. Stripping it here accepts both tag styles.
      - name: Resolve package version from the release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "The tag '$tag' does not resolve to a NuGet version (got '$version')."
            exit 1
          fi
          echo "Packing version $version from tag $tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # ReadmeFenceCheck sets IsPackable=false and is not in the solution, and the test project sets
      # IsPackable=false, so only the SDK is packed.
      - name: Build NuGet Package
        run: >
          dotnet pack src/OnCourse.ABConnect/OnCourse.ABConnect.csproj
          -c Release
          --no-build
          -p:PackageVersion=${{ steps.version.outputs.version }}
          -o ./artifacts

      - name: Upload nuget package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg

      - name: Publish NuGet Package
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          -k ${{ secrets.NUGET_TOKEN }}
          -s https://api.nuget.org/v3/index.json
          --skip-duplicate
