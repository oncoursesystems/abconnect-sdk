name: Release Package

on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege. id-token: write is what lets this workflow request the OIDC token that NuGet
# trades for a publishing key; it grants nothing else, and in particular no write access to the
# repository. Everything else stays read-only.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    # NuGet's trusted publishing policy for this repository names this environment, so the token
    # exchange only succeeds from a run deployed into it. The environment requires a reviewer, so a
    # push to nuget.org needs a human to approve the run first; without it, any workflow_dispatch of
    # this file could mint a publishing key.
    #
    # Its deployment rule is a tag pattern, not "protected branches only". This workflow publishes on
    # a release, which runs against a tag ref, and a tag is not a branch: the protected-branches rule
    # rejects the deployment outright with "Tag X is not allowed to deploy to nuget-publish".
    environment: nuget-publish

    steps:
      # Before the build rather than beside the login step it guards. The variable is the one input to
      # this job that nothing else validates, and learning it is missing after a full build and test
      # run wastes the reviewer's approval along with the time.
      - name: Verify the NuGet account is configured
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ vars.NUGET_USER }}" ]; then
            echo "The NUGET_USER repository variable is not set."
            echo "Set it to the nuget.org username that created the trusted publishing policy."
            exit 1
          fi
          echo "Publishing as nuget.org user '${{ vars.NUGET_USER }}'."

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # global-json-file, not dotnet-version: the repository pins an SDK feature band, and 8.0.1xx and
      # 8.0.4xx ship different analyzer versions. Letting CI resolve 8.0.x independently is how a build
      # passes on a developer machine and fails here on a rule neither of them chose.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore OnCourse.ABConnect.sln

      - name: Build
        run: dotnet build OnCourse.ABConnect.sln -c Release --no-restore -warnaserror

      # The Live trait needs devel partner credentials, which CI does not have. This step also covers
      # gate G-7: the README ships as the package README, and ReadmeSampleTests compiles every fence
      # in it against the built assembly, so a sample that does not compile fails here.
      - name: Test
        run: dotnet test OnCourse.ABConnect.sln -c Release --no-build --filter "Category!=Live"

      # The version is the release tag with any leading "v" removed. NuGet rejects "v3.0.0" as a
      # version string outright, so passing the raw ref name fails the pack for every tag written in
      # the conventional "v"-prefixed form. Stripping it here accepts both tag styles.
      - name: Resolve package version from the release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "The tag '$tag' does not resolve to a NuGet version (got '$version')."
            exit 1
          fi
          echo "Packing version $version from tag $tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The test project sets IsPackable=false, so only the SDK is packed.
      - name: Build NuGet Package
        run: >
          dotnet pack src/OnCourse.ABConnect/OnCourse.ABConnect.csproj
          -c Release
          --no-build
          -p:PackageVersion=${{ steps.version.outputs.version }}
          -o ./artifacts

      - name: Upload nuget package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg

      # Trusted publishing, so there is no long-lived NuGet key in this repository or the organization
      # to leak, expire unnoticed, or rotate. GitHub signs a token describing this run, nuget.org
      # validates it against the policy naming this repository, this workflow file, and the
      # nuget-publish environment, and returns a publishing key.
      #
      # The key it returns lives for one hour and can only be issued once per token, so this step sits
      # immediately before the push rather than at the top of the job: a key fetched before the build
      # and tests would be burning most of its life waiting on them.
      #
      # 'user' is the personal nuget.org account that CREATED the policy, not the account that owns it
      # and not the account that owns the package. Those differ here: the policy is owned by the
      # OncourseSystems organization, because ownership is what scopes the returned key to that
      # organization's packages, but the token endpoint looks the policy up by its creator. Passing
      # the organization name fails with "No matching trust policy owned by user 'OncourseSystems'".
      #
      # It reads from a repository variable rather than sitting here literally, and the reason is the
      # trigger. A release event runs the workflow file recorded at the tagged commit, so a wrong
      # literal cannot be corrected by editing master: it takes deleting the tag, re-cutting the
      # release, and approving the environment again. A variable is read when the job runs, so the
      # same mistake becomes one edit in Settings and a re-run. A variable and not a secret because a
      # username is not one, and because a value nobody can see is a value nobody notices going stale.
      - name: Exchange the OIDC token for a short-lived NuGet key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet Package
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          -s https://api.nuget.org/v3/index.json
          --skip-duplicate
